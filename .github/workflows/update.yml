name: 更新台電資料並發布網站

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # 約每 10 分鐘；避開整點與整十分鐘，GitHub 在那些時間很忙、排程常被延遲或略過
  workflow_dispatch:          # 可以在 Actions 頁面手動按「Run workflow」
  push:
    branches: [main]          # 上傳或修改檔案後也會立刻更新一次

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取回上次的資料（今日曲線、最新資料）
        # 開放資料只有「當下」的數字，今日曲線是每次執行累積的；
        # 上次的結果就放在已發布的網站上，這裡把它抓回來接著寫。第一次執行抓不到是正常的。
        run: |
          mkdir -p data
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data"
          for f in today.json latest.json; do
            curl -fsS -m 30 "$BASE_URL/$f?t=$(date +%s)" -o "data/$f" || rm -f "data/$f"
          done
          ls -la data
        continue-on-error: true

      - name: 抓取台電資料
        run: python scripts/update_data.py
        continue-on-error: true

      - name: 保存需要累積的歷史資料
        # 上傳時如果儲存庫剛好有別的更新（被 GitHub 回「fetch first」），就先合併再重試。
        # 即使保存失敗也不影響下面的「發布網站」，網頁照常更新。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/counties.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "更新歷史資料 $(TZ=Asia/Taipei date '+%F %H:%M')"
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs -q origin main && git push -q origin main; then
                echo "已保存（第 $i 次嘗試）"
                exit 0
              fi
              echo "上傳被拒絕，等幾秒後重試（$i/4）"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            echo "::warning::歷史資料這次沒能保存，下次執行會再試；網站仍會照常更新。"
          fi
        continue-on-error: true

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 發布網站
        id: deploy
        uses: actions/deploy-pages@v4
